name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOPROXY: https://proxy.golang.org
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - run: make check build fuzz audit reproducible
      - run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - run: docker build --platform linux/amd64 -t confidential-gateway:ci .
      - run: docker run --rm confidential-gateway:ci -policy-hash
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: binaries-linux-amd64
          path: bin/
          retention-days: 7
