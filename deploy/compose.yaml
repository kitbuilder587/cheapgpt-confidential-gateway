services:
  gateway:
    image: ${GATEWAY_IMAGE:?set an immutable image digest}
    platform: linux/amd64
    restart: unless-stopped
    init: true
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 2
    stop_grace_period: 25s
    ulimits:
      core: 0
      nofile:
        soft: 4096
        hard: 4096
    ports:
      - "8080:8080"
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock:ro
    environment:
      GATEWAY_AUTH_TOKEN: ${GATEWAY_AUTH_TOKEN:?set via encrypted Phala secrets}
      GOMEMLIMIT: 2GiB
      GOMAXPROCS: "2"
      GOTRACEBACK: none
    logging:
      driver: none
